name: Rotate org profile README

on:
  schedule:
    # Mondays 14:00 UTC. The first run of each month is the first Monday, which starts
    # that month's rotation; later runs only refresh the catalog and reuse the selection.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "Render as of this date (YYYY-MM-DD). Blank means today."
        required: false
      dry_run:
        description: "Print the selection without committing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rotate-profile-readme
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Render README and catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ inputs.date }}
        run: python3 scripts/rotate_readme.py ${DATE:+--date "$DATE"}

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git add profile rotation
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rotate org profile README ($(date -u +%Y-%m))"
          git push
