name: Rotate org profile README

on:
  schedule:
    # Mondays 14:00 UTC. The first run of each month is the first Monday, which starts
    # that month's rotation; later runs only refresh the catalog and reuse the selection.
    - cron: "0 14 * * 1"
  pull_request:
    # Exercises the script on a real runner; never commits.
    paths:
      - ".github/workflows/rotate-profile-readme.yml"
      - "scripts/**"
      - "rotation/**"
      - "profile/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the selection without committing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rotate-profile-readme
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
    steps:
      # The push to main is made by the nemo-automation-bot app, which is allowed to
      # bypass the pull request requirement. GITHUB_TOKEN stays read-only.
      - name: Create bot token
        id: bot
        if: ${{ env.PUSH == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BOT_ID }}
          private-key: ${{ secrets.BOT_KEY }}
          permission-contents: write

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.bot.outputs.token || github.token }}

      - name: Render README and catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ env.PUSH != 'true' && '1' || '' }}
        run: python3 scripts/rotate_readme.py ${DRY_RUN:+--dry-run}

      - name: Commit and push
        if: ${{ env.PUSH == 'true' }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          git add profile rotation
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          bot_id=$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git commit -m "chore: rotate org profile README ($(date -u +%Y-%m))"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push attempt ${attempt} failed; rebasing on origin/${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
